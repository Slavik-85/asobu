# Builds an installable, self-updating Asobu and publishes it as a GitHub Release.
#
# Runs on a version tag, so cutting a release is `git tag v0.1.1 && git push --tags` and
# nothing else. Velopack works out the delta against the previous release by downloading it
# first, which is why the upload step needs the repository rather than just a folder of files.
name: Release

on:
  push:
    tags:
      - "v*"

  # Buildable by hand as well, for checking the pipeline without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true
        default: "0.0.1-test"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Velopack reads the previous release to build a delta against it; a shallow clone is
          # fine for that, but tags are wanted for the version below.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk

      - name: Publish
        # The CurseForge key reaches the build from a repository secret and never from the
        # repository itself. The project reads this variable on its own; see Asobu.Core.csproj.
        # Without the secret set, the build still succeeds and simply ships without CurseForge,
        # which the build warns about rather than failing on.
        env:
          ASOBU_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: >
          dotnet publish src/Asobu.App/Asobu.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # Read as bytes and search the raw text. Select-String has no byte mode — its
      # -Encoding takes a character encoding and rejects "Byte" outright, which fails the
      # step rather than the check.
      - name: Refuse to ship a release with no CurseForge key
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("publish/Asobu.Core.dll")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch "CurseForgeApiKey") {
            Write-Error "No CurseForge key in this build. Set the CURSEFORGE_API_KEY repository secret."
            exit 1
          }
          Write-Host "CurseForge key is present in the build."

      # A delta is a patch against the previous release, and vpk builds one only when that
      # release is sitting in the output folder. A CI runner starts empty, so without this
      # every release is a full download for everyone — 63 MB to fix a typo. Allowed to
      # fail: the very first release has nothing to fetch, and a fetch that fails should cost
      # a delta rather than the release.
      - name: Fetch the previous release, so a delta can be built against it
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases

      - name: Pack
        run: >
          vpk pack
          --packId Asobu
          --packTitle Asobu
          --packAuthors "Asobu"
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe Asobu.App.exe
          --icon assets/asobu.ico
          --splashImage assets/installer-splash.gif
          --splashProgressColor "#FF9EC0"
          --outputDir releases

      - name: Publish the release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --tag v${{ steps.version.outputs.value }}
          --releaseName "Asobu ${{ steps.version.outputs.value }}"
          --publish

  # The same application for Linux: an AppImage that updates itself, and a .deb, .rpm and
  # tarball for installing it like any other program.
  #
  # Runs after the Windows job rather than beside it, and merges into the release that job
  # created. Two jobs creating the same tag at the same time is a race with a corrupted release
  # at the end of it, and the couple of minutes this costs is a couple of minutes.
  #
  # Windows and Linux builds live in separate Velopack channels, so each platform's launcher
  # only ever sees updates it can actually install.
  linux:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Avalonia draws with Skia and shapes text with HarfBuzz, both of which want fontconfig
      # present to find a font at all. It is on ubuntu-latest already; installed explicitly so
      # a future runner image dropping it fails here rather than in front of a user.
      - name: Install the packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 desktop-file-utils rpm

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk

      - name: Publish
        env:
          ASOBU_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: >
          dotnet publish src/Asobu.App/Asobu.App.csproj
          -c Release -r linux-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # -a searches a binary as if it were text, which is the whole trick here.
      - name: Refuse to ship a release with no CurseForge key
        run: |
          if ! grep -aq "CurseForgeApiKey" publish/Asobu.Core.dll; then
            echo "::error::No CurseForge key in this build. Set the CURSEFORGE_API_KEY repository secret."
            exit 1
          fi
          echo "CurseForge key is present in the build."

      # dotnet marks the apphost executable on a Linux publish, but an AppImage whose entry
      # point is not executable fails at the moment someone runs it rather than here.
      - name: Make sure the entry point is executable
        run: chmod +x publish/Asobu.App

      - name: Fetch the previous release, so a delta can be built against it
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel linux
          --outputDir releases

      # No splash image: that is the Windows installer's, and an AppImage has no installer to
      # show one during. It is copied where the user wants it and run.
      - name: Pack
        run: >
          vpk pack
          --packId Asobu
          --packTitle Asobu
          --packAuthors "Asobu"
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe Asobu.App
          --channel linux
          --icon assets/asobu.png
          --outputDir releases

      - name: Add the AppImage to the release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --channel linux
          --tag v${{ steps.version.outputs.value }}
          --releaseName "Asobu ${{ steps.version.outputs.value }}"
          --merge
          --publish

      # The same app as a .deb, an .rpm and a tarball, for installing like any other program:
      # into /opt, in the app menu, owned by the package manager. Built from the publish folder
      # the AppImage came from, and after the AppImage is safely up, so a fault in packaging
      # costs these three files and never the release.
      # The version arrives through the environment rather than pasted into the script, so a tag
      # name with shell characters in it is only ever text.
      - name: Build the .deb, .rpm and tarball
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash packaging/linux/build-packages.sh "$VERSION" publish dist

      # Installed for real on the runner, which catches a dependency that does not exist on
      # Ubuntu before anybody else finds it.
      - name: Check the packages
        run: |
          desktop-file-validate packaging/linux/cc.asobu.Asobu.desktop
          sudo apt-get install -y ./dist/Asobu-linux-x64.deb
          test -x /usr/bin/asobu
          test "$(cat /opt/asobu/package-type)" = deb
          rpm -qpi dist/Asobu-linux-x64.rpm
          rpm -qpl dist/Asobu-linux-x64.rpm | grep -q /usr/bin/asobu
          tar -tzf dist/Asobu-linux-x64.tar.gz asobu/Asobu.App asobu/install.sh

          # The tarball's own installer, run for real as an ordinary user.
          mkdir -p "$RUNNER_TEMP/tarball" && tar -xzf dist/Asobu-linux-x64.tar.gz -C "$RUNNER_TEMP/tarball"
          bash "$RUNNER_TEMP/tarball/asobu/install.sh"
          test -x "$HOME/.local/share/asobu/Asobu.App"
          grep -q "^Exec=\"$HOME/.local/share/asobu/Asobu.App\"" "$HOME/.local/share/applications/cc.asobu.Asobu.desktop"
          desktop-file-validate "$HOME/.local/share/applications/cc.asobu.Asobu.desktop"
          bash "$HOME/.local/share/asobu/install.sh" --uninstall

      # vpk uploads only what it built itself, so these go up through the GitHub CLI.
      - name: Add the .deb, .rpm and tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Arch's own package, built inside Arch from the tarball the linux job just published, then
  # installed there for real before it goes up. After that job rather than beside it, because it
  # needs the tarball to exist; and on its own, so a fault here costs one file.
  arch:
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git github-cli

      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # makepkg refuses to run as root, which is all a container has, so it gets a user of its
      # own. pacman allows no hyphen in a version: 0.2.0-beta becomes 0.2.0_beta.
      - name: Build the package from the release's tarball
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          [[ $VERSION =~ ^[0-9A-Za-z.+-]+$ ]]
          useradd -m builder
          mkdir -p /tmp/arch dist
          cp packaging/arch/PKGBUILD /tmp/arch/
          sed -i "s/@VERSION@/${VERSION//-/_}/" /tmp/arch/PKGBUILD
          gh release download "v$VERSION" -p Asobu-linux-x64.tar.gz -D /tmp/arch -R "$GITHUB_REPOSITORY"
          chown -R builder /tmp/arch
          su builder -c "cd /tmp/arch && makepkg --noconfirm --nodeps"
          cp /tmp/arch/asobu-*.pkg.tar.zst dist/Asobu-linux-x64.pkg.tar.zst

      - name: Check the package
        shell: bash
        run: |
          pacman -U --noconfirm dist/Asobu-linux-x64.pkg.tar.zst
          test -x /usr/bin/asobu
          test "$(cat /opt/asobu/package-type)" = arch
          test -f /usr/share/applications/cc.asobu.Asobu.desktop

      - name: Add it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release upload "v$VERSION" dist/Asobu-linux-x64.pkg.tar.zst --clobber -R "$GITHUB_REPOSITORY"

  # Asobu's own Flatpak repository, signed, which the website serves at asobu.cc/flatpak/repo and
  # app stores install from through asobu.cc/flatpak/asobu.flatpakref. Built here from this
  # release's tarball and attached to the release as one archive; the Website workflow unpacks
  # the newest one into the site whenever it deploys. Skipped, with a warning, until the signing
  # key is in the repository's secrets, so it can never cost a release. Real releases only: a
  # test build run by hand would otherwise be what every Flatpak user updates to.
  flatpak:
    needs: linux
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import the signing key
        shell: bash
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::No FLATPAK_GPG_PRIVATE_KEY secret, so no Flatpak repository this release."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')" >> "$GITHUB_ENV"

      - name: Point the recipe at this release's tarball
        if: env.SKIP != '1'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, urllib.request
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{os.environ['VERSION']}/Asobu-linux-x64.tar.gz"
          sha = hashlib.sha256(urllib.request.urlopen(url).read()).hexdigest()
          path = "packaging/flatpak/cc.asobu.Asobu.yml"
          text = open(path).read()
          text = re.sub(r"url: https://github.com/.*/Asobu-linux-x64.tar.gz", "url: " + url, text)
          text = re.sub(r"sha256: [0-9a-f]{64}", "sha256: " + sha, text)
          open(path, "w").write(text)
          print(url, sha)
          PY

      - name: Build and sign the repository
        if: env.SKIP != '1'
        shell: bash
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --gpg-sign="$GPG_KEY" --repo=repo --default-branch=stable \
            build-dir packaging/flatpak/cc.asobu.Asobu.yml
          flatpak build-update-repo --gpg-sign="$GPG_KEY" --generate-static-deltas --prune \
            --title=Asobu --default-branch=stable repo
          tar -czf asobu-flatpak-repo.tar.gz repo
          ls -la asobu-flatpak-repo.tar.gz

      # Through the API rather than the GitHub CLI, which this image does not carry.
      - name: Add it to the release
        if: env.SKIP != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          name = "asobu-flatpak-repo.tar.gz"
          auth = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          api = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
          release = json.load(urllib.request.urlopen(urllib.request.Request(f"{api}/releases/tags/v{os.environ['VERSION']}", headers=auth)))
          for asset in release["assets"]:
              if asset["name"] == name:
                  urllib.request.urlopen(urllib.request.Request(asset["url"], method="DELETE", headers=auth))
          upload = release["upload_url"].split("{")[0] + "?name=" + name
          request = urllib.request.Request(upload, data=open(name, "rb").read(), method="POST",
                                           headers={**auth, "Content-Type": "application/gzip"})
          print(json.load(urllib.request.urlopen(request))["browser_download_url"])
          PY
