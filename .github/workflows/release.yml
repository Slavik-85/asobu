# Builds an installable, self-updating Asobu and publishes it as a GitHub Release.
#
# Runs on a version tag, so cutting a release is `git tag v0.1.1 && git push --tags` and
# nothing else. Velopack works out the delta against the previous release by downloading it
# first, which is why the upload step needs the repository rather than just a folder of files.
name: Release

on:
  push:
    tags:
      - "v*"

  # Buildable by hand as well, for checking the pipeline without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v"
        required: true
        default: "0.0.1-test"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Velopack reads the previous release to build a delta against it; a shallow clone is
          # fine for that, but tags are wanted for the version below.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk

      - name: Publish
        # The CurseForge key reaches the build from a repository secret and never from the
        # repository itself. The project reads this variable on its own; see Asobu.Core.csproj.
        # Without the secret set, the build still succeeds and simply ships without CurseForge,
        # which the build warns about rather than failing on.
        env:
          ASOBU_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: >
          dotnet publish src/Asobu.App/Asobu.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # Read as bytes and search the raw text. Select-String has no byte mode — its
      # -Encoding takes a character encoding and rejects "Byte" outright, which fails the
      # step rather than the check.
      - name: Refuse to ship a release with no CurseForge key
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("publish/Asobu.Core.dll")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch "CurseForgeApiKey") {
            Write-Error "No CurseForge key in this build. Set the CURSEFORGE_API_KEY repository secret."
            exit 1
          }
          Write-Host "CurseForge key is present in the build."

      # A delta is a patch against the previous release, and vpk builds one only when that
      # release is sitting in the output folder. A CI runner starts empty, so without this
      # every release is a full download for everyone — 63 MB to fix a typo. Allowed to
      # fail: the very first release has nothing to fetch, and a fetch that fails should cost
      # a delta rather than the release.
      - name: Fetch the previous release, so a delta can be built against it
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases

      - name: Pack
        run: >
          vpk pack
          --packId Asobu
          --packTitle Asobu
          --packAuthors "Asobu"
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe Asobu.App.exe
          --icon assets/asobu.ico
          --splashImage assets/installer-splash.gif
          --splashProgressColor "#FF9EC0"
          --outputDir releases

      - name: Publish the release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --tag v${{ steps.version.outputs.value }}
          --releaseName "Asobu ${{ steps.version.outputs.value }}"
          --publish

  # The same application, packed as an AppImage.
  #
  # Runs after the Windows job rather than beside it, and merges into the release that job
  # created. Two jobs creating the same tag at the same time is a race with a corrupted release
  # at the end of it, and the couple of minutes this costs is a couple of minutes.
  #
  # Windows and Linux builds live in separate Velopack channels, so each platform's launcher
  # only ever sees updates it can actually install.
  linux:
    needs: windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Avalonia draws with Skia and shapes text with HarfBuzz, both of which want fontconfig
      # present to find a font at all. It is on ubuntu-latest already; installed explicitly so
      # a future runner image dropping it fails here rather than in front of a user.
      - name: Install the packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 desktop-file-utils

      - name: Work out the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Velopack tool
        run: dotnet tool install -g vpk

      - name: Publish
        env:
          ASOBU_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: >
          dotnet publish src/Asobu.App/Asobu.App.csproj
          -c Release -r linux-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # -a searches a binary as if it were text, which is the whole trick here.
      - name: Refuse to ship a release with no CurseForge key
        run: |
          if ! grep -aq "CurseForgeApiKey" publish/Asobu.Core.dll; then
            echo "::error::No CurseForge key in this build. Set the CURSEFORGE_API_KEY repository secret."
            exit 1
          fi
          echo "CurseForge key is present in the build."

      # dotnet marks the apphost executable on a Linux publish, but an AppImage whose entry
      # point is not executable fails at the moment someone runs it rather than here.
      - name: Make sure the entry point is executable
        run: chmod +x publish/Asobu.App

      - name: Fetch the previous release, so a delta can be built against it
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel linux
          --outputDir releases

      # No splash image: that is the Windows installer's, and an AppImage has no installer to
      # show one during. It is copied where the user wants it and run.
      - name: Pack
        run: >
          vpk pack
          --packId Asobu
          --packTitle Asobu
          --packAuthors "Asobu"
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe Asobu.App
          --channel linux
          --icon assets/asobu.png
          --outputDir releases

      - name: Add the AppImage to the release
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases
          --channel linux
          --tag v${{ steps.version.outputs.value }}
          --releaseName "Asobu ${{ steps.version.outputs.value }}"
          --merge
          --publish
