# Builds the Flatpak the way Flathub will, as a check, and keeps the bundle to try out.
#
# Runs after every successful release and on demand. The recipe in packaging/flatpak names one
# release's tarball; this points a copy at the latest release first, so it always tests what was
# just published. Nothing here publishes anything: Flathub builds and serves the real one.
name: Flatpak

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  flatpak:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Point the recipe at the latest release
        run: |
          python3 - <<'EOF'
          import json, hashlib, re, urllib.request
          release = json.load(urllib.request.urlopen(
              "https://api.github.com/repos/${{ github.repository }}/releases/latest"))
          url = next(a["browser_download_url"] for a in release["assets"] if a["name"] == "Asobu-linux-x64.tar.gz")
          sha = hashlib.sha256(urllib.request.urlopen(url).read()).hexdigest()
          path = "packaging/flatpak/cc.asobu.Asobu.yml"
          text = open(path).read()
          text = re.sub(r"url: https://github.com/.*/Asobu-linux-x64.tar.gz", "url: " + url, text)
          text = re.sub(r"sha256: [0-9a-f]{64}", "sha256: " + sha, text)
          open(path, "w").write(text)
          print(release["tag_name"], url, sha)
          EOF

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Asobu.flatpak
          manifest-path: packaging/flatpak/cc.asobu.Asobu.yml
          cache-key: flatpak-builder-${{ github.sha }}

      # Flathub's own linter, which its reviewers run too. Reported, not enforced, while the
      # store listing still lacks its screenshots.
      - name: Lint the recipe and the build
        continue-on-error: true
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/cc.asobu.Asobu.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
